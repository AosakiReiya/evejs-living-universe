name: Release

on:
  push:
    tags: 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Package release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate version consistency
        run: |
          VERSION="$(cat VERSION)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$VERSION" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME does not match VERSION ($VERSION)"
            exit 1
          fi
          go run ./cmd/xeve-patch audit

      - name: Cross-compile for all platforms
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            out="dist/xeve-patch-${os}-${arch}${ext}"
            echo ">> building $target -> $out"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath \
              -ldflags "-X github.com/AosakiReiya/evejs-living-universe/internal/buildinfo.Version=${VERSION}" \
              -o "$out" ./cmd/xeve-patch
          done

      - name: Package release zips
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            suffix="${os}-${arch}"
            pkg="dist/X-Eve-Living-Universe-${VERSION}-${suffix}"
            mkdir -p "$pkg"
            cp -r patches "$pkg/patches"
            cp README.md LICENSE CHANGELOG.md "$pkg/"
            bin="xeve-patch"; [ "$os" = "windows" ] && bin="xeve-patch.exe"
            cp "dist/xeve-patch-${suffix}$([ "$os" = "windows" ] && echo .exe)" "$pkg/$bin"
            ( cd dist && zip -qr "$(basename "$pkg").zip" "$(basename "$pkg")" )
            echo ">> packaged dist/$(basename "$pkg").zip"
          done

      - name: Extract changelog section
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            $0 ~ "^## \\[" tag "\\]" {flag=1; next}
            $0 ~ "^## \\[" && flag {exit}
            flag
          ' CHANGELOG.md > changelog_section.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "X-Eve Living Universe ${{ github.ref_name }}" \
            --notes-file changelog_section.md \
            --generate-notes \
            dist/X-Eve-Living-Universe-*.zip
